<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/Cadastro.css">
</head>

<body>

    <main>

        <button class="voltar" onclick="window.location.href='../index.html'">Volte</button>

        <!----------------------------- Conteudo Main abaixo!!!------------------------------------------>

        <div class="selecao">

            <div id="menuInicial">

                <button class="ONG" onclick="mostrarFormulario('ong')">
                    Sou uma ONG
                </button>

                <button class="Usuario" onclick="mostrarFormulario('usuario')">
                    Sou um Usuário
                </button>

            </div>

        </div>

        <div id="formOng" class="formulario oculto">
            <h2>Cadastro ONG</h2>

            <button onclick="voltar()" class="voltar">← Voltar</button>

            <input type="text" placeholder="Nome da ONG">
            <input type="text" placeholder="CNPJ">
            <input type="email" placeholder="E-mail">
        </div>

        <div id="formUsuario" class="formulario oculto">
            <h2>Cadastro Usuário</h2>

            <button onclick="voltar()"  class="voltar" >← Voltar</button>

            <input type="text" placeholder="Nome">
            <input type="date">
            <input type="email" placeholder="E-mail">
        </div>

        </div>



    </main>

    <script src="../js/Cadastros.js"></script>
</body>

</html>

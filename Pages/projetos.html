<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos</title>
    <link rel="stylesheet" href="../css/projeto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

</head>

<body>

    <!----------------------------- Header e Nav bar abaixo junto das logos e informações!!!------------------------------------------>

    <header>

        <nav class="topo">

            <img src="../imagens/logo com borda.png" height="120px" width="95px" class="logo">
            <img src="../imagens/logo escrita.png" height="90px" width="110px" class="logoescrita">

            <div class="menu-mobile">

                <button id="menuBtn" class="menu-btn">
                    ☰
                </button>

                <ul id="menuLista" class="menu-lista">
                    <li><a href="../index.html">inicio</a></li>
                    <li><a href="Pages/eventos.html">Eventos</a></li>
                    <li><a href="Pages/vagas.html">Vagas</a></li>
                </ul>
            </div>


            <!----------------------------- Header e Nav bar abaixo junto dos botões------------------------------------------>

            <div class="areaUsuario">

                <button class="Cadastrar" onclick="window.location.href='../9Pages/Cadastro.html'">Cadastrar</button>
                <button class="Entrar" onclick="window.location.href='../Pages/Login.html'">Entrar</button>

            </div>

        </nav>

    </header>

    <!----------------------------- Conteudo Main abaixo!!!------------------------------------------>


    <main>
        <section class="projetos">

            <h1>Projetos Sociais</h1>

            <div class="filtros">

                <input type="text" id="pesquisa" placeholder="Pesquisar projeto...">

                <select id="categoria">
                    <option value="Todos">Categorias</option>
                    <option value="Educação">Educação</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Meio Ambiente">Meio Ambiente</option>
                    <option value="Proteção Animal">Proteção Animal</option>
                    <option value="Cultura">Cultura</option>
                    <option value="Esporte">Esporte</option>
                    <option value="Esporte">Tecnologia</option>
                    <option value="Esporte">Assistência Social</option>
                    <option value="Esporte">Terceira Idade</option>
                    <option value="Esporte">Inclusão Social</option>
                    <option value="Esporte">Conservação Marinha</option>
                </select>





                <select id="cidade">
                    <option value="Todos">Cidades</option>
                    <option value="São Paulo">São Paulo</option>
                    <option value="São Bernardo do Campo">São Bernardo do Campo</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Mauá">Mauá</option>
                    <option value="Santos">Santos </option>
                    <option value="Campinas">Campinas</option>
                    <option value="Guarulhos">Guarulhos</option>
                    <option value="Diadema"> Diadema</option>
                </select>

            </div>

            <div class="cards" id="cards"></div>

            <div id="paginacao"></div>

        </section>

        <!-- MODAL -->

        <div id="modal" class="modal">

            <div class="modal-content">

                <span id="fechar-modal">&times;</span>

                <img id="modal-img">

                <div class="modal-info">

                    <span id="modal-categoria"></span>

                    <h2 id="modal-titulo"></h2>

                    <p id="modal-descricao"></p>

                    <p>📍 <span id="modal-local"></span></p>

                    <p>📞 <span id="modal-telefone"></span></p>

                    <p>✉️ <span id="modal-email"></span></p>

                    <a id="modal-site" target="_blank">
                        Visitar Site
                    </a>

                    <button id="btn-seguir">
                        Seguir Projeto
                    </button>

                    <p id="seguidores">
                        ❤️ 0 pessoas seguem este projeto
                    </p>

                </div>

            </div>

        </div>

    </main>

    <script src="../js/projetos.js"></script>
</body>

</html>
